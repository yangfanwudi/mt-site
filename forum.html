<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交流区 · 我叫MT：崛起 · 攻略站</title>
  <meta name="description" content="我叫MT：崛起攻略站交流区：综合讨论、阵容交流、求助提问、攻略分享版块，并基于 GitHub Discussions（giscus）提供评论区。">
  <link rel="icon" type="image/png" href="assets/img/favicon-32.png">
  <!-- 样式在前：全站唯一样式文件 -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="canonical" href="https://yangfanwudi.github.io/mt-site/forum.html">
</head>
<body>
  <!-- 页头（site-header）由 common.js 的 MTCommon.mount 注入到 body 顶部 -->

  <main class="page">
    <!-- 页面标题区 -->
    <section class="page-hero">
      <div class="container">
        <p class="page-hero__eyebrow">玩家社区</p>
        <h1 class="page-hero__title">交流区</h1>
        <p class="page-hero__desc">
          与其他玩家聊阵容、问问题、分享心得。版块整理中，评论区基于
          GitHub Discussions（giscus），部署后即可直接交流。
        </p>
      </div>
    </section>

    <div class="container">
      <!-- 版块卡片 -->
      <section class="section" aria-labelledby="boards-title">
        <h2 class="section__title" id="boards-title">版块</h2>
        <p class="section__desc">四个版块正在筹备中，先行开放评论区。</p>

        <div class="card-grid card-grid--4">
          <article class="card">
            <div class="card__head">
              <span class="card__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 9h8M8 12h5"/></svg></span>
              <h3 class="card__title">综合讨论</h3>
              <span class="badge badge--muted">待开放</span>
            </div>
            <p class="card__desc">聊聊版本、活动与游戏日常，畅所欲言。</p>
          </article>

          <article class="card">
            <div class="card__head">
              <span class="card__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l13 13M20 4 7 17"/><path d="M15 17l3 3M9 17l-3 3M4 4l3.5 1M20 4l-3.5 1"/></svg></span>
              <h3 class="card__title">阵容交流</h3>
              <span class="badge badge--muted">待开放</span>
            </div>
            <p class="card__desc">晒出你的推图、爬塔阵容，一起打磨配队思路。</p>
          </article>

          <article class="card">
            <div class="card__head">
              <span class="card__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.1 1-1.1 1.8M12 16.8h.01"/></svg></span>
              <h3 class="card__title">求助提问</h3>
              <span class="badge badge--muted">待开放</span>
            </div>
            <p class="card__desc">卡关了？把box截图发上来，大家帮你出主意。</p>
          </article>

          <article class="card">
            <div class="card__head">
              <span class="card__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>
              <h3 class="card__title">攻略分享</h3>
              <span class="badge badge--muted">待开放</span>
            </div>
            <p class="card__desc">发布你的原创攻略与实测数据，沉淀进站点攻略库。</p>
          </article>
        </div>
      </section>

      <!-- 评论区（giscus） -->
      <section class="section" aria-labelledby="comment-title">
        <h2 class="section__title" id="comment-title">评论区</h2>
        <p class="section__desc">使用 GitHub 账号登录后留言，支持表情回应与回复。</p>
        <div id="giscus-comment" class="giscus-wrap"></div>
      </section>
    </div>
  </main>

  <!-- 页脚（site-footer，含免责声明）由 MTCommon.mount 注入到 body 末尾 -->

  <noscript>
    <div class="alert alert--warn container">
      <p>本站导航与评论区依赖 JavaScript，请启用后刷新页面。</p>
    </div>
  </noscript>

  <!-- body 末尾脚本顺序：data 脚本 → common.js → 页面脚本（mount 在最前调用） -->

  <!-- ① data 脚本：giscus 配置（部署到 GitHub Pages 并开启仓库 Discussions 后填写） -->
  <script>
    window.MT_GISCUS = {
      repo: "yangfanwudi/mt-site",
      repoId: "R_kgDOVXe_Pw",
      category: "Announcements",
      categoryId: "DIC_kwDOVXe_P84DJoTP"
    };
  </script>

  <!-- ② 全站公共脚本 -->
  <script src="assets/js/common.js"></script>

  <!-- ③ 页面脚本：先挂载骨架，再加载评论区 -->
  <script>
    (function () {
      'use strict';

      /* 骨架挂载：页头 / 导航高亮 / 移动端菜单 / 页脚 */
      MTCommon.mount('forum');

      /* giscus 加载器：配置完整则注入 client.js，否则显示友好提示条 */
      var cfg = window.MT_GISCUS || {};
      var mountEl = document.getElementById('giscus-comment');
      if (!mountEl) return;

      var configured = cfg.repo && cfg.repoId && cfg.categoryId;
      if (configured) {
        var s = document.createElement('script');
        s.src = 'https://giscus.app/client.js';
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.setAttribute('data-repo', cfg.repo);
        s.setAttribute('data-repo-id', cfg.repoId);
        s.setAttribute('data-category', cfg.category || 'Announcements');
        s.setAttribute('data-category-id', cfg.categoryId);
        s.setAttribute('data-mapping', 'pathname');
        s.setAttribute('data-strict', '0');
        s.setAttribute('data-reactions-enabled', '1');
        s.setAttribute('data-emit-metadata', '0');
        s.setAttribute('data-input-position', 'top');
        s.setAttribute('data-theme', 'transparent_dark');
        s.setAttribute('data-lang', 'zh-CN');
        s.setAttribute('data-loading', 'lazy');
        mountEl.appendChild(s);
      } else {
        var tip = document.createElement('div');
        tip.className = 'alert alert--info';
        tip.setAttribute('role', 'status');
        tip.innerHTML = '<p><strong>评论区尚未启用。</strong>' +
          '评论交流基于 GitHub Discussions（giscus，免运维、无服务器）。' +
          '将本站部署到 GitHub Pages 并在仓库设置中开启 Discussions 后，' +
          '在 forum.html 顶部的 <code>window.MT_GISCUS</code> 中填入 ' +
          '<code>repo / repoId / category / categoryId</code> 四项配置（可从 giscus.app 获取），' +
          '刷新页面即可启用评论交流。</p>';
        mountEl.appendChild(tip);
      }
    })();
  </script>
</body>
</html>
